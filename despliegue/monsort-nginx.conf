# /etc/nginx/sites-available/monsort
#
# Reemplaza DOMINIO por el dominio real antes de aplicar.
# El bloque SSL lo escribe certbot; este archivo se instala primero
# escuchando solo en :80 y certbot lo modifica.

# --- Redireccion a HTTPS -----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    # Certbot necesita esta ruta accesible por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Sitio ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO www.DOMINIO;

    # certbot rellena estas dos lineas.
    # ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

    # Los CFDI traen RFC, razon social y domicilio de los clientes.
    # No queremos que nada de eso quede en cache de intermediarios.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Los PDF y XML de factura pesan; el limite default de 1 MB es corto
    # si algun dia se sube documentacion desde el dashboard.
    client_max_body_size 25M;

    access_log /var/log/nginx/monsort-acceso.log;
    error_log  /var/log/nginx/monsort-error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ----------------------------------------------------------
    location /api/ {
        # La barra final en proxy_pass hace que /api/facturas llegue a
        # uvicorn como /facturas. Sin ella llegaria como /api/facturas y
        # ninguna ruta coincidiria.
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # POST /facturas/{id}/verificar-sat espera hasta 30 s al
        # webservice del SAT. Los reportes PDF con ReportLab tambien
        # tardan. 120 s da holgura sin dejar conexiones colgadas para
        # siempre.
        proxy_connect_timeout 15s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        # Las respuestas de descarga de PDF/XML no deben acumularse en
        # disco de nginx.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Swagger, solo si lo quieres accesible en produccion.
    # Comentar estos dos bloques para cerrarlo al publico.
    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend (build de Vite) -------------------------------------
    root /srv/monsort/ProyectoMonsort/Frontend/dist;
    index index.html;

    # Los assets de Vite llevan hash en el nombre: cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html para que el
    # router de React se encargue. index.html NUNCA se cachea, o los
    # usuarios se quedan con una version vieja apuntando a assets que
    # ya no existen.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
