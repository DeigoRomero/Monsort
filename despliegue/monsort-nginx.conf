# /etc/nginx/sites-available/monsort
#
# Dominio: facturas.grupomonsort.com
#
# Este archivo se instala primero escuchando solo en :80. Certbot lo
# modifica al emitir el certificado: agrega el bloque 443 con las rutas
# de los .pem y la redireccion. Por eso el segundo server block viene
# con las lineas ssl_certificate comentadas.

# --- HTTP: validacion de certbot y redireccion -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name facturas.grupomonsort.com;

    # Certbot necesita esta ruta accesible por HTTP sin redirigir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: el sitio ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name facturas.grupomonsort.com;

    # Certbot rellena estas dos lineas al correr:
    #   certbot --nginx -d facturas.grupomonsort.com
    # ssl_certificate     /etc/letsencrypt/live/facturas.grupomonsort.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/facturas.grupomonsort.com/privkey.pem;

    # Cabeceras de seguridad base.
    #
    # OJO: en nginx, add_header en un bloque hijo REEMPLAZA todos los del
    # padre, no los suma. Por eso estas cuatro estan repetidas en cada
    # location que define su propio add_header. Si se agrega una cabecera
    # aqui, hay que agregarla tambien alla o esas rutas se quedan sin ella.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # El limite default de 1 MB es corto si algun dia se sube
    # documentacion desde el dashboard.
    client_max_body_size 25M;

    access_log /var/log/nginx/monsort-acceso.log;
    error_log  /var/log/nginx/monsort-error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ----------------------------------------------------------
    location /api/ {
        # La barra final es obligatoria. Con ella, /api/facturas llega a
        # uvicorn como /facturas. Sin ella llegaria como /api/facturas y
        # ninguna ruta coincidiria.
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /facturas/{id}/verificar-sat espera hasta 30 s al
        # webservice del SAT. Los reportes con ReportLab tambien tardan.
        # 120 s da holgura sin dejar conexiones colgadas para siempre.
        proxy_connect_timeout 15s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        # Las descargas de PDF y XML no deben acumularse en disco.
        proxy_buffering off;
        proxy_request_buffering off;

        # Los CFDI traen RFC, razon social y domicilio de los clientes de
        # Monsort. Nada de eso debe quedar en cache de intermediarios.
        add_header Cache-Control "no-store" always;

        # Repetidas: el add_header de arriba anula las del bloque server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Swagger. Comentar estos dos bloques para cerrarlo al publico.
    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend (build de Vite) -------------------------------------
    root /srv/monsort/ProyectoMonsort/Frontend/dist;
    index index.html;

    # Los assets de Vite llevan hash en el nombre: cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repetidas: el add_header de arriba anula las del bloque server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html para que el
    # router de React se encargue. index.html NUNCA se cachea, o los
    # usuarios quedan con una version vieja apuntando a assets que ya
    # no existen.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";

        # Repetidas: el add_header de arriba anula las del bloque server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}