# /etc/nginx/snippets/monsort-seguridad.conf
#
# Encabezados de seguridad del sitio. Se incluyen con
#     include snippets/monsort-seguridad.conf;
# en CADA location que tenga su propio add_header: en nginx un add_header en
# un bloque hijo borra todos los del padre (ver learnings del proyecto). Con
# el snippet ya no hay que copiar la lista a mano y olvidarse de una.

# HTTPS obligatorio por 2 años, también para subdominios de facturas.*
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# Nadie puede meter el sitio en un iframe (clickjacking)
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Content-Security-Policy: el navegador solo ejecuta scripts servidos por
# este mismo dominio. Un script inyectado (XSS) no corre ni puede mandar
# datos a otro servidor (connect-src 'self').
#   - fonts.googleapis.com / fonts.gstatic.com: tipografías de index.html
#   - blob:  para abrir los PDF descargados con la sesión
#   - data:  el favicon SVG embebido
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
