# /etc/nginx/sites-available/monsort
#
# Dominio: facturas.grupomonsort.com
#
# Versión endurecida (30/09/2026). Requiere el snippet de encabezados:
#     sudo cp despliegue/nginx-seguridad.conf /etc/nginx/snippets/monsort-seguridad.conf
#
# Este archivo YA trae las líneas de certificado que certbot había agregado a
# mano en el servidor; si certbot se vuelve a correr, revisa que no las
# duplique. Probar SIEMPRE antes de recargar:
#     sudo nginx -t && sudo systemctl reload nginx

# Límites de peticiones por IP (contexto http: este archivo se incluye ahí).
#   login: 10 por minuto con ráfaga de 5 → fuerza bruta inviable
#   api:   30 por segundo con ráfaga de 60 → uso normal holgado
limit_req_zone $binary_remote_addr zone=monsort_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=monsort_api:10m  rate=30r/s;
limit_req_status 429;

# --- HTTP: validación de certbot y redirección --------------------------
server {
    listen 80;
    listen [::]:80;
    server_name facturas.grupomonsort.com;
    server_tokens off;

    # Certbot necesita esta ruta accesible por HTTP sin redirigir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: el sitio -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name facturas.grupomonsort.com;

    ssl_certificate     /etc/letsencrypt/live/facturas.grupomonsort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facturas.grupomonsort.com/privkey.pem;
    # Protocolos y cifrados de certbot (TLS 1.2 y 1.3, sin cifrados débiles)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No anunciar la versión de nginx
    server_tokens off;

    include snippets/monsort-seguridad.conf;

    # La API no recibe archivos: 2 MB sobra para cualquier JSON.
    client_max_body_size 2M;
    # Conexiones lentas a propósito (slowloris) se cortan
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    # Solo los métodos que usa la aplicación
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    access_log /var/log/nginx/monsort-acceso.log;
    error_log  /var/log/nginx/monsort-error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos ocultos (.env, .git, etc.) nunca, bajo ninguna ruta
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # --- Login: límite estricto contra fuerza bruta --------------------
    location = /api/auth/login {
        limit_req zone=monsort_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/auth/login;
        include snippets/monsort-proxy.conf;
        add_header Cache-Control "no-store" always;
        include snippets/monsort-seguridad.conf;
    }

    # --- API -------------------------------------------------------------
    location /api/ {
        limit_req zone=monsort_api burst=60 nodelay;

        # La barra final es obligatoria. Con ella, /api/facturas llega a
        # uvicorn como /facturas.
        proxy_pass http://127.0.0.1:8000/;
        # (timeouts en el snippet: 120 s, porque POST /facturas/{id}/verificar-sat
        #  espera hasta 30 s al SAT y los reportes también tardan)
        include snippets/monsort-proxy.conf;

        # Las descargas de PDF y XML no deben acumularse en disco.
        proxy_buffering off;
        proxy_request_buffering off;

        # CFDI con RFC, razón social y domicilios: nada en caché intermedio.
        add_header Cache-Control "no-store" always;
        include snippets/monsort-seguridad.conf;
    }

    # Swagger (/docs, /openapi.json) YA NO se publica. En producción la API
    # los tiene apagados; para consultarlos, usar un túnel SSH:
    #     ssh -L 8000:127.0.0.1:8000 monsort@64.177.80.14
    # y abrir http://localhost:8000/docs con ENTORNO=desarrollo en local.

    # --- Frontend (build de Vite) ----------------------------------------
    # OJO: el sitio se sirve desde /var/www/monsort, NO desde el dist del
    # repo. despliegue.sh copia el build ahí (ver claude/despliegue-y-
    # seguridad-2026-09-28.md en el proyecto).
    root /var/www/monsort;
    index index.html;

    # Los assets de Vite llevan hash en el nombre: caché agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/monsort-seguridad.conf;
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html. index.html NUNCA
    # se cachea, o los usuarios quedan con una versión vieja.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
        include snippets/monsort-seguridad.conf;
    }
}
